[project]
name = "bootcamp-handson-genai-mlops"
version = "0.1.0"
description = "WPS Hands-on Bootcamp"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.1.1",
    "dotenv>=0.9.9",
    "einops>=0.8.1",
    "fastmcp>=2.13.0.2",
    "huggingface-hub>=0.35.3",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.9",
    "langchain>=0.3.27",
    "langchain-anthropic>=1.3.4",
    "langchain-community>=0.3.31",
    "langchain-openai>=0.3.35",
    "mcp>=1.20.0",
    "mlflow>=3.10.0",
    "openai>=2.3.0",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "pymongo>=4.15.3",
    "pymupdf>=1.27.1",
    "pypdf>=6.1.1",
    "python-dotenv>=1.1.1",
    "sentence-transformers>=5.1.1",
    "sqlalchemy>=2.0.44",
    "voyageai>=0.3.5",
    "yfinance>=0.2.66",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
